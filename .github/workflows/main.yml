name: Create Module Files For GitHub Release
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          manifest.version = process.env.RELEASE_TAG.replace(/^v/, '');
          manifest.url = base;
          manifest.manifest = `${base}/releases/latest/download/module.json`;
          manifest.download = `${base}/releases/download/${process.env.RELEASE_TAG}/module.zip`;
          fs.writeFileSync('module.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
      - name: Package module
        run: zip -r module.zip module.json README.md CREDITS.md LICENSE scripts styles assets macros
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: module.json,module.zip
          token: ${{ secrets.GITHUB_TOKEN }}
